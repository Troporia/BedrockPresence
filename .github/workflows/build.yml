name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prefer standalone LLVM
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Ensure cppwinrt on INCLUDE
        shell: pwsh
        run: |
          if ($env:INCLUDE -match 'cppwinrt') {
            Write-Host "INCLUDE already contains cppwinrt"
          } else {
            $cppwinrt = "$($env:WindowsSdkDir)Include\$($env:WindowsSDKVersion)cppwinrt"
            if (Test-Path $cppwinrt) {
              Add-Content $env:GITHUB_ENV "INCLUDE=$env:INCLUDE;$cppwinrt"
              Write-Host "Appended $cppwinrt to INCLUDE"
            } else {
              Write-Error "cppwinrt headers not found at $cppwinrt"
            }
          }

      - name: Check the toolchain
        shell: pwsh
        run: |
          clang-cl --version
          ninja --version
          cmake --version

      - name: Configure
        run: cmake --preset relwithdebinfo

      - name: Build
        run: cmake --build --preset relwithdebinfo

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/relwithdebinfo/bedrock_presence.dll dist/
          Copy-Item build/relwithdebinfo/bedrock_presence.pdb dist/ -ErrorAction SilentlyContinue
          Copy-Item build/relwithdebinfo/bedrock_presence_injector.exe dist/
          Copy-Item examples/presence_server.py dist/
          Copy-Item config.example.json dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-presence
          path: dist/
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
